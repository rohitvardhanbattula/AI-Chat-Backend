_schema-version: '3.1'
ID: ai-chat-backend
version: 1.0.0
description: AnswerThink Enterprise AI Hub — CAP Backend

modules:
  - name: ai-chatbackend-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1G
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
    properties:
      NODE_ENV: production
    requires:
      - name: ai-chatbackendtest-db
      - name: ai-chatbackend-uaa
      - name: ai-chatbackend-destination
      - name: ai-chatbackend-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: ai-chat-backend-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ai-chatbackendtest-db

resources:
  - name: ai-chatbackend-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ai-chatbackend
        tenant-mode: dedicated

  # --- Destination Service (To find the on-prem system) ---
  - name: ai-chatbackend-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # --- Connectivity Service (The tunnel to on-prem) ---
  - name: ai-chatbackend-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: ai-chatbackendtest-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
