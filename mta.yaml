_schema-version: '3.1'
ID: ai-chat-backend
version: 1.0.0
description: AnswerThink Enterprise AI Hub — CAP Backend

modules:
  - name: ai-chat-backend-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1G
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
    properties:
      NODE_ENV: production
    requires:
      - name: ai-chat-db
      - name: ai-chat-dest
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: ai-chat-backend-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ai-chat-db

resources:
  - name: ai-chat-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: ai-chat-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
